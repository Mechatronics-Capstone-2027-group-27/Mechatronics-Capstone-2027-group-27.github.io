name: Work log entry
description: Post an individual work-log entry. Team members only — anyone else's issue is closed automatically.
title: "[Work log] "
labels: ["work-log"]
body:
  - type: markdown
    attributes:
      value: |
        Your name is taken from your GitHub account — no need to enter it.
        When you submit, a bot turns this into a page on the site and closes the issue. If something is wrong it comments here instead.
  # Kind marker read by .github/scripts/post-entry.cjs. It has to be a real field:
  # `type: markdown` blocks are shown on the form but never reach the issue body.
  # Deliberately NOT required: GitHub sometimes shows "None" instead of the default, and a
  # required field then blocks the post. The bot falls back to the label and the title prefix.
  - type: dropdown
    id: kind
    attributes:
      label: Entry type
      description: Leave this as it is — it tells the bot which kind of post this is.
      options:
        - Work log entry
      default: 0
  - type: input
    id: title
    attributes:
      label: Title
      description: What did you do? 5–120 characters.
      placeholder: Characterized servo deflection under load
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: The day the work happened. Leave blank for today.
      placeholder: YYYY-MM-DD
    validations:
      required: false
  - type: checkboxes
    id: collaborators
    attributes:
      label: Collaborators
      description: Who worked on this with you? (If you tick yourself, it's ignored.)
      options:
        # BEGIN members — generated by `npm run sync:allowlist` from src/config/site.ts; do not edit by hand
        - label: Ethan Catz
        - label: Ian Macpherson
        - label: David Makarczyk
        - label: Nitya Singh
        - label: Matthew Zelenka
        # END members
  - type: input
    id: timeCommitted
    attributes:
      label: Time committed
      description: Hours, decimals OK (e.g. 2.5).
      placeholder: "2.5"
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Content of progress
      description: Markdown supported. Aim for at least a few sentences — what you did, what you found, what's next.
    validations:
      required: true
  - type: input
    id: contribution
    attributes:
      label: Your contribution
      description: Optional. One line on what YOU did, shown under your name. Most useful when you ticked collaborators — the entry also appears on their tabs, and each of them can add their own line later.
      placeholder: Ran the agenda and took the notes below.
    validations:
      required: false
  - type: textarea
    id: images
    attributes:
      label: Images
      description: Drag images into this box to upload them to GitHub, then leave the generated markdown here. Add a short description in the [square brackets] of each — it becomes the alt text.
    validations:
      required: false
