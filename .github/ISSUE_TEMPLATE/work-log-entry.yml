name: Work log entry
description: Post a work-log entry. Team members only — anyone else's issue is closed automatically.
title: "[Work log] "
labels: ["work-log"]
body:
  - type: markdown
    attributes:
      value: |
        You are the author — your name is taken from your GitHub account.
        When you submit, a bot turns this into a page on the site and closes the issue. If something is wrong it comments here instead.
  # Kind marker read by .github/scripts/post-entry.cjs. It has to be a real field:
  # `type: markdown` blocks are shown on the form but never reach the issue body.
  # Deliberately NOT required: GitHub sometimes shows "None" instead of the default, and a
  # required field then blocks the post. The bot falls back to the label and the title prefix.
  - type: dropdown
    id: kind
    attributes:
      label: Entry type
      description: Leave this as it is — it tells the bot which kind of post this is.
      options:
        - Work log entry
      default: 0
  - type: input
    id: title
    attributes:
      label: Title
      description: What was done? 5–120 characters.
      placeholder: Characterized servo deflection under load
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: The day the work happened. Leave blank for today.
      placeholder: YYYY-MM-DD
    validations:
      required: false
  - type: textarea
    id: content
    attributes:
      label: Content of progress
      description: The task as a whole — what was done, what you found, what's next. Markdown supported. Aim for at least a few sentences.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Media
  - type: textarea
    id: images
    attributes:
      label: Images
      description: Drag images into this box to upload them to GitHub, then leave the generated markdown here. Add a short description in the [square brackets] of each — it becomes the alt text.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## Who did what
        **Fill in a box for everyone who worked on this, including yourself.** A blank box means that person wasn't involved: filling in someone's box is what adds them to the entry.

        Write each person's own part, not the whole story again, and their hours (decimals OK, e.g. 2.5). For someone who only attended, a short line such as "Attended, no specific deliverable" is fine.

        Your own hours are always required, even if you leave your own description blank.
  # Per-person blocks, labelled by .github/scripts/form-fields.cjs — the same module the
  # bot uses to read them, so the labels and the parser cannot drift apart.
  # BEGIN members — generated by `npm run sync:allowlist` from src/config/site.ts; do not edit by hand
  - type: markdown
    attributes:
      value: "### Ethan Catz"
  - type: input
    id: hours-ethan-catz
    attributes:
      label: "Ethan Catz — hours"
      description: "Hours Ethan Catz spent, decimals OK. Blank if they weren't involved."
      placeholder: "2.5"
    validations:
      required: false
  - type: textarea
    id: contribution-ethan-catz
    attributes:
      label: "Ethan Catz — contribution"
      description: "What Ethan Catz did. Leave blank if they weren't involved. Markdown is fine."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "### Ian Macpherson"
  - type: input
    id: hours-ian-macpherson
    attributes:
      label: "Ian Macpherson — hours"
      description: "Hours Ian Macpherson spent, decimals OK. Blank if they weren't involved."
      placeholder: "2.5"
    validations:
      required: false
  - type: textarea
    id: contribution-ian-macpherson
    attributes:
      label: "Ian Macpherson — contribution"
      description: "What Ian Macpherson did. Leave blank if they weren't involved. Markdown is fine."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "### David Makarczyk"
  - type: input
    id: hours-david-makarczyk
    attributes:
      label: "David Makarczyk — hours"
      description: "Hours David Makarczyk spent, decimals OK. Blank if they weren't involved."
      placeholder: "2.5"
    validations:
      required: false
  - type: textarea
    id: contribution-david-makarczyk
    attributes:
      label: "David Makarczyk — contribution"
      description: "What David Makarczyk did. Leave blank if they weren't involved. Markdown is fine."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "### Nitya Singh"
  - type: input
    id: hours-nitya-singh
    attributes:
      label: "Nitya Singh — hours"
      description: "Hours Nitya Singh spent, decimals OK. Blank if they weren't involved."
      placeholder: "2.5"
    validations:
      required: false
  - type: textarea
    id: contribution-nitya-singh
    attributes:
      label: "Nitya Singh — contribution"
      description: "What Nitya Singh did. Leave blank if they weren't involved. Markdown is fine."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "### Matthew Zelenka"
  - type: input
    id: hours-matthew-zelenka
    attributes:
      label: "Matthew Zelenka — hours"
      description: "Hours Matthew Zelenka spent, decimals OK. Blank if they weren't involved."
      placeholder: "2.5"
    validations:
      required: false
  - type: textarea
    id: contribution-matthew-zelenka
    attributes:
      label: "Matthew Zelenka — contribution"
      description: "What Matthew Zelenka did. Leave blank if they weren't involved. Markdown is fine."
    validations:
