# Fails if .github/allowlist.json or the issue form's member list is stale
# relative to MEMBERS in src/config/site.ts. Fix with `npm run sync:allowlist`.
name: Check allowlist

on:
  push:
    paths: ['src/config/site.ts', '.github/allowlist.json', '.github/ISSUE_TEMPLATE/**', 'scripts/sync-allowlist.mjs']
  pull_request:
    paths: ['src/config/site.ts', '.github/allowlist.json', '.github/ISSUE_TEMPLATE/**', 'scripts/sync-allowlist.mjs']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:allowlist
